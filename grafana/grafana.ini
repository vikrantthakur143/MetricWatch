app_mode = production
instance_name = grafana

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
temp_data_lifetime = 240h

[server]
protocol = https
http_addr = 0.0.0.0
http_port = 3000
; root_url is set from .env by docker-compose.yml (GF_SERVER_ROOT_URL).
;root_url = https://localhost:3000
; cert_file and cert_key are set from .env by docker-compose.yml
; (GF_SERVER_CERT_FILE / GF_SERVER_CERT_KEY), because the path contains the
; certificate domain and this file cannot interpolate .env.
;cert_file = /certs/<domain>/fullchain.pem
;cert_key = /certs/<domain>/privkey.pem
enable_gzip = true

[database]
type = sqlite3
path = grafana.db

[security]
# admin_user and admin_password come from .env via docker-compose.yml
# (GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD__FILE), because the
# password file is named after the user -- secrets/grafana_<user> -- and
# Grafana rejects a ${VAR} inside $__file{}, so the path cannot be written
# here.
#
# Either way this only seeds the admin account on a fresh database; an
# existing one keeps its old password until reset with
# `grafana cli admin reset-admin-password`.
#admin_user = admin
#admin_password = $__file{/run/secrets/grafana_admin}
cookie_secure = true

[dashboards]
versions_to_keep = 20
min_refresh_interval = 5s

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark

[log]
mode = console
level = info

[metrics]
enabled = true
interval_seconds = 10
