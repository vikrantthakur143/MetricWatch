#

groups:
  - name: Alertmanager Monitoring
    rules:
    - alert: PrometheusAlertmanagerJobMissing
      expr: absent(up{job="alertmanager"})
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: Prometheus AlertManager job missing (instance {{ $labels.instance }})
        description: "A Prometheus AlertManager job has disappeared\n  VALUE = {{ $value
          }}\n  LABELS = {{ $labels }}"
    - alert: PrometheusAlertmanagerConfigurationReloadFailure
      expr: alertmanager_config_last_reload_successful != 1
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: Prometheus AlertManager configuration reload failure (instance {{ $labels.instance
          }})
        description: "AlertManager configuration reload error\n  VALUE = {{ $value }}\n
          \ LABELS = {{ $labels }}"
    - alert: PrometheusAlertmanagerConfigNotSynced
      expr: count(count_values("config_hash", alertmanager_config_hash)) > 1
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: Prometheus AlertManager config not synced (instance {{ $labels.instance
          }})
        description: "Configurations of AlertManager cluster instances are out of sync\n
          \ VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
    - alert: PrometheusAlertmanagerE2eDeadManSwitch
      expr: vector(1)
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: Prometheus AlertManager E2E dead man switch (instance {{ $labels.instance
          }})
        description: "Prometheus DeadManSwitch is an always-firing alert. It's used as
          an end-to-end test of Prometheus through the Alertmanager.\n  VALUE = {{ $value
          }}\n  LABELS = {{ $labels }}"
    - alert: PrometheusNotConnectedToAlertmanager
      expr: prometheus_notifications_alertmanagers_discovered < 1
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: Prometheus not connected to alertmanager (instance {{ $labels.instance
          }})
        description: "Prometheus cannot connect the alertmanager\n  VALUE = {{ $value
          }}\n  LABELS = {{ $labels }}"
    - alert: PrometheusAlertmanagerNotificationFailing
      expr: rate(alertmanager_notifications_failed_total[1m]) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: Prometheus AlertManager notification failing (instance {{ $labels.instance
          }})
        description: "Alertmanager is failing sending notifications\n  VALUE = {{ $value
          }}\n  LABELS = {{ $labels }}"

